<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa" />
      <stop offset="100%" stop-color="#eef1f5" />
    </linearGradient>
    <linearGradient id="gMistica" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#660099" />
      <stop offset="100%" stop-color="#52007a" />
    </linearGradient>
    <linearGradient id="gVercel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="gQA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="gSupabase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gIam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="gSoD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect width="960" height="1220" fill="url(#bg)" rx="16" />

  <text x="40" y="46" font-family="'Outfit','Segoe UI',sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Fluxo de Seed da Base de Conhecimento Vetorial (RAG)</text>
  <text x="40" y="72" font-family="'Outfit','Segoe UI',sans-serif" font-size="14" fill="#64748b">scripts/seed-production-rag.ts · execução 100% isolada via terminal · impacto ZERO na aplicação</text>

  <!-- 1. Fonte de dados -->
  <g transform="translate(170,105)">
    <rect width="620" height="78" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)" />
    <rect width="8" height="78" rx="4" fill="url(#gIam)" />
    <text x="26" y="26" font-family="'Outfit',sans-serif" font-size="14" font-weight="bold" fill="#92400e">1 · Fonte de Dados — data/requisitos-sd.json</text>
    <text x="26" y="48" font-family="'Outfit',sans-serif" font-size="11" fill="#475569">Array de 314 requisitos: [ { "code": "CYBER.SEGURA.AUT.01", "description": "..." } ]</text>
    <text x="26" y="66" font-family="'Outfit',sans-serif" font-size="11" fill="#475569">Mapeamento: title=code · source="Base-SD-v4.1" · content="{code} - {description}"</text>
  </g>
  <line x1="480" y1="183" x2="480" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 2. Script isolado -->
  <g transform="translate(170,204)">
    <rect width="620" height="78" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2" filter="url(#shadow)" />
    <rect width="8" height="78" rx="4" fill="url(#gVercel)" />
    <text x="26" y="26" font-family="'Outfit',sans-serif" font-size="14" font-weight="bold" fill="#0f172a">2 · Execução Isolada (Terminal / TSX)</text>
    <text x="26" y="48" font-family="'Outfit',sans-serif" font-size="11" fill="#475569">npm run db:seed:rag                    → npx --yes tsx scripts/seed-production-rag.ts</text>
    <text x="26" y="66" font-family="'Outfit',sans-serif" font-size="11" fill="#475569">npm run db:seed:rag -- --dry-run        → valida sem gravar nada</text>
  </g>
  <line x1="480" y1="282" x2="480" y2="299" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 3. Batch -->
  <g transform="translate(170,303)">
    <rect width="620" height="78" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2" filter="url(#shadow)" />
    <rect width="8" height="78" rx="4" fill="url(#gSoD)" />
    <text x="26" y="26" font-family="'Outfit',sans-serif" font-size="14" font-weight="bold" fill="#0e7490">3 · Batch Processing</text>
    <text x="26" y="48" font-family="'Outfit',sans-serif" font-size="11" fill="#475569">Processa em LOTES de 10 requisitos por vez</text>
    <text x="26" y="66" font-family="'Outfit',sans-serif" font-size="11" fill="#475569">Delay de 2s entre lotes — blindagem contra Rate Limit 429 da API de embeddings</text>
  </g>
  <line x1="480" y1="381" x2="480" y2="398" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 4. Idempotência -->
  <g transform="translate(170,402)">
    <rect width="620" height="92" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2" filter="url(#shadow)" />
    <rect width="8" height="92" rx="4" fill="url(#gQA)" />
    <text x="26" y="26" font-family="'Outfit',sans-serif" font-size="14" font-weight="bold" fill="#991b1b">4 · Prevenção de Duplicidade (Idempotência)</text>
    <text x="26" y="48" font-family="'Outfit',sans-serif" font-size="11" fill="#475569">SELECT title FROM knowledge_articles — title/code já existente?</text>
    <text x="26" y="66" font-family="'Outfit',sans-serif" font-size="11" fill="#475569">SIM → SKIP (pula o registro, sem gastar cota de embedding) → próximo item</text>
    <text x="26" y="84" font-family="'Outfit',sans-serif" font-size="11" fill="#475569">NÃO → gera o embedding e insere. O script pode rodar N vezes sem duplicar.</text>
  </g>
  <line x1="480" y1="494" x2="480" y2="511" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 5. Embeddings -->
  <g transform="translate(170,515)">
    <rect width="620" height="92" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)" />
    <rect width="8" height="92" rx="4" fill="url(#gAI)" />
    <text x="26" y="26" font-family="'Outfit',sans-serif" font-size="14" font-weight="bold" fill="#3730a3">5 · Geração de Embeddings — gemini-embedding-2 (3072 dimensões)</text>
    <text x="26" y="48" font-family="'Outfit',sans-serif" font-size="11" fill="#475569">embedMany da string consolidada "{code} - {description}" (1 chamada por lote)</text>
    <text x="26" y="66" font-family="'Outfit',sans-serif" font-size="11" fill="#475569">Retry com backoff exponencial (2s→4s→8s→15s) apenas em erros transitórios (429/5xx)</text>
    <text x="26" y="84" font-family="'Outfit',sans-serif" font-size="11" fill="#475569">Erro permanente → fallback item-a-item (embed) isolando o requisito problemático</text>
  </g>
  <line x1="480" y1="607" x2="480" y2="624" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 6. Inserção -->
  <g transform="translate(170,628)">
    <rect width="620" height="92" rx="10" fill="#ffffff" stroke="#660099" stroke-width="2" filter="url(#shadow)" />
    <rect width="8" height="92" rx="4" fill="url(#gMistica)" />
    <text x="26" y="26" font-family="'Outfit',sans-serif" font-size="14" font-weight="bold" fill="#52007a">6 · Inserção Segura (Prisma Raw Query pgvector)</text>
    <text x="26" y="48" font-family="'Outfit',sans-serif" font-size="11" fill="#475569">prisma.$executeRaw — INSERT INTO knowledge_articles (title, source, content, embedding)</text>
    <text x="26" y="66" font-family="'Outfit',sans-serif" font-size="11" fill="#475569">VALUES ($title, $source, $content, $vector::vector) — padrão validado no teste de infraestrutura</text>
    <text x="26" y="84" font-family="'Outfit',sans-serif" font-size="11" fill="#475569">Validação de dimensão (≠3072 → pula com log, sem quebrar o lote)</text>
  </g>
  <line x1="480" y1="720" x2="480" y2="737" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 7. Persistência -->
  <g transform="translate(170,741)">
    <rect width="620" height="78" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)" />
    <rect width="8" height="78" rx="4" fill="url(#gSupabase)" />
    <text x="26" y="26" font-family="'Outfit',sans-serif" font-size="14" font-weight="bold" fill="#047857">7 · Persistência — public.knowledge_articles (Supabase · pgvector)</text>
    <text x="26" y="48" font-family="'Outfit',sans-serif" font-size="11" fill="#475569">Coluna embedding vector(3072) · extensão pgvector (sem índice HNSW >2000 dims)</text>
    <text x="26" y="66" font-family="'Outfit',sans-serif" font-size="11" fill="#475569">Base pronta para busca semântica no Copiloto de IA e no Motor Embarcável</text>
  </g>
  <line x1="480" y1="819" x2="480" y2="836" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 8. Delay / próximo lote -->
  <g transform="translate(170,840)">
    <rect width="620" height="78" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)" />
    <rect width="8" height="78" rx="4" fill="#94a3b8" />
    <text x="26" y="26" font-family="'Outfit',sans-serif" font-size="14" font-weight="bold" fill="#334155">8 · Delay anti Rate Limit → Próximo Lote</text>
    <text x="26" y="48" font-family="'Outfit',sans-serif" font-size="11" fill="#475569">Aguarda 2 segundos (setTimeout) e repete até processar todos os requisitos</text>
    <text x="26" y="66" font-family="'Outfit',sans-serif" font-size="11" fill="#475569">Logs em tempo real por lote/item + contadores acumulados (inseridos · pulados · falhas)</text>
  </g>
  <line x1="480" y1="918" x2="480" y2="935" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 9. Resumo -->
  <g transform="translate(170,939)">
    <rect width="620" height="78" rx="10" fill="url(#gMistica)" filter="url(#shadow)" />
    <text x="26" y="28" font-family="'Outfit',sans-serif" font-size="14" font-weight="bold" fill="#ffffff">9 · Resumo Final do Seed</text>
    <text x="26" y="52" font-family="'Outfit',sans-serif" font-size="11" fill="#f3e8ff">Relatório: total · inseridos · pulados (idempotência) · falhas de dimensão · falhas permanentes</text>
    <text x="26" y="70" font-family="'Outfit',sans-serif" font-size="11" fill="#f3e8ff">Exit code 0 (sucesso) ou 1 (houve falhas permanentes) — pronto para CI</text>
  </g>
</svg>
