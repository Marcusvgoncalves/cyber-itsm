<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="100%" height="100%" style="background-color: #FAF9FC; font-family: 'Outfit', sans-serif;">
  <!-- Definitions for arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#660099" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8E8EA8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Title Section -->
  <text x="50" y="45" font-size="22" font-weight="800" fill="#660099">CyberITSM SPN - Desenho de Arquitetura C4 Enterprise</text>
  <text x="50" y="68" font-size="11" fill="#6B6B84">Mapeamento detalhado do ambiente, contêineres, controle de acessos (RBAC/MFA) e conectores de identidades</text>

  <!-- USER PERSONA -->
  <g transform="translate(425, 30)" filter="url(#shadow)">
    <rect width="150" height="85" rx="10" fill="#660099" />
    <text x="75" y="28" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Pessoa: Analista SPN</text>
    <text x="75" y="46" font-size="8" fill="#F3E6FB" text-anchor="middle">[Operador de Segurança]</text>
    <text x="75" y="65" font-size="8" fill="#FFFFFF" text-anchor="middle">Acessa painel &amp; opera Kanban</text>
  </g>

  <!-- Connection: User to Vercel Proxy -->
  <path d="M 500 115 L 500 155" fill="none" stroke="#660099" stroke-width="2" marker-end="url(#arrow)" />
  <text x="510" y="138" font-size="9" font-weight="600" fill="#6B6B84">HTTPS / Browser</text>

  <!-- CYBERITSM SYSTEM BOUNDARY -->
  <rect x="50" y="165" width="900" height="425" rx="16" fill="none" stroke="#660099" stroke-width="2" stroke-dasharray="6,6" />
  <text x="70" y="192" font-size="13" font-weight="800" fill="#660099">CyberITSM SPN (Fronteira Híbrida Vercel + Render)</text>

  <!-- CONTAINER 1: FRONTEND SPA (Vercel CDN) -->
  <g transform="translate(100, 220)" filter="url(#shadow)">
    <rect width="320" height="160" rx="12" fill="#FFFFFF" stroke="#E3E3EC" stroke-width="2" />
    <text x="20" y="28" font-size="11" font-weight="700" fill="#222235">Contêiner: Frontend SPA [Vercel CDN]</text>
    <text x="20" y="45" font-size="9" fill="#9EA0B5">Tecnologias: HTML5, CSS (Mistica Brand), JS</text>
    
    <!-- Child Components inside Frontend -->
    <rect x="15" y="70" width="135" height="70" rx="6" fill="#FAF9FC" stroke="#E3E3EC" />
    <text x="82" y="90" font-size="9" font-weight="700" fill="#222235" text-anchor="middle">UI View Layer</text>
    <text x="82" y="108" font-size="7.5" fill="#6B6B84" text-anchor="middle">CSS Mistica Light Tokens</text>
    <text x="82" y="125" font-size="7.5" fill="#FF9900" font-weight="600" text-anchor="middle">RBAC Visual Controls</text>

    <rect x="170" y="70" width="135" height="70" rx="6" fill="#FAF9FC" stroke="#E3E3EC" />
    <text x="237" y="90" font-size="9" font-weight="700" fill="#222235" text-anchor="middle">DOM Controller</text>
    <text x="237" y="108" font-size="7.5" fill="#6B6B84" text-anchor="middle">app.js / Fetch API state</text>
    <text x="237" y="125" font-size="7.5" fill="#660099" font-weight="600" text-anchor="middle">Same-Origin Sessions</text>
  </g>

  <!-- EDGE REVERSE PROXY / REWRITES -->
  <g transform="translate(435, 275)" filter="url(#shadow)">
    <rect width="130" height="50" rx="6" fill="#FF9900" stroke="#FF9900" stroke-width="1.5" />
    <text x="65" y="22" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Vercel Proxy Edge</text>
    <text x="65" y="38" font-size="8" fill="#FFFFFF" text-anchor="middle">rewrites (/api/*)</text>
  </g>

  <!-- Connections for Proxy -->
  <path d="M 420 300 L 435 300" fill="none" stroke="#FF9900" stroke-width="1.5" />
  <path d="M 565 300 L 580 300" fill="none" stroke="#660099" stroke-width="2" marker-end="url(#arrow)" />

  <!-- CONTAINER 2: BACKEND API [Render Web Service] -->
  <g transform="translate(580, 220)" filter="url(#shadow)">
    <rect width="320" height="160" rx="12" fill="#FFFFFF" stroke="#E3E3EC" stroke-width="2" />
    <text x="20" y="28" font-size="11" font-weight="700" fill="#222235">Contêiner: Backend API [Render Service]</text>
    <text x="20" y="45" font-size="9" fill="#9EA0B5">Tecnologias: Ruby, Sinatra microservice</text>
    
    <!-- Child Components inside Backend -->
    <rect x="15" y="70" width="135" height="70" rx="6" fill="#FAF9FC" stroke="#E3E3EC" />
    <text x="82" y="90" font-size="9" font-weight="700" fill="#222235" text-anchor="middle">REST Router &amp; RBAC</text>
    <text x="82" y="108" font-size="7.5" fill="#6B6B84" text-anchor="middle">Sinatra Filters &amp; Helpers</text>
    <text x="82" y="125" font-size="7.5" fill="#9b51e0" font-weight="600" text-anchor="middle">No-Backdoor TOTP (rotp)</text>

    <rect x="170" y="70" width="135" height="70" rx="6" fill="#FAF9FC" stroke="#E3E3EC" />
    <text x="237" y="90" font-size="9" font-weight="700" fill="#222235" text-anchor="middle">ActiveRecord ORM</text>
    <text x="237" y="108" font-size="7.5" fill="#6B6B84" text-anchor="middle">Models &amp; Audit Logs</text>
    <text x="237" y="125" font-size="7.5" fill="#660099" font-weight="600" text-anchor="middle">Safe Status Cascade</text>
  </g>

  <!-- DATABASE (SQLite3 on Render Volume / PostgreSQL Ready) -->
  <g transform="translate(665, 455)" filter="url(#shadow)">
    <rect width="150" height="85" rx="8" fill="#FFFFFF" stroke="#E3E3EC" stroke-width="2" />
    <!-- Cylinder details -->
    <path d="M 0 10 A 75 10 0 0 0 150 10 M 0 10 L 0 75 A 75 10 0 0 0 150 75 L 150 10" fill="none" stroke="#E3E3EC" stroke-width="2" />
    <text x="75" y="32" font-size="11" font-weight="700" fill="#222235" text-anchor="middle">Base de Dados</text>
    <text x="75" y="50" font-size="9" fill="#9EA0B5" text-anchor="middle">SQLite3 (db/data/)</text>
    <text x="75" y="65" font-size="8" fill="#FF9900" font-weight="600" text-anchor="middle">Render Disk Volume</text>
  </g>

  <!-- Connection: Backend to Database -->
  <path d="M 740 380 L 740 445" fill="none" stroke="#660099" stroke-width="2" marker-end="url(#arrow)" />
  <text x="750" y="415" font-size="9" font-weight="600" fill="#6B6B84">ActiveRecord SQL</text>

  <!-- EXTERNAL IDENTITY SYSTEMS -->
  <rect x="50" y="620" width="900" height="130" rx="16" fill="none" stroke="#8E8EA8" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="70" y="645" font-size="10" font-weight="700" fill="#8E8EA8">Sistemas de Identidades Externos (Simulados)</text>

  <!-- Provider 1: EntraID -->
  <g transform="translate(100, 665)" filter="url(#shadow)">
    <rect width="180" height="60" rx="8" fill="#FFFFFF" stroke="#E3E3EC" />
    <text x="90" y="25" font-size="10" font-weight="700" fill="#222235" text-anchor="middle">Microsoft Entra ID</text>
    <text x="90" y="45" font-size="8" fill="#6B6B84" text-anchor="middle">OIDC Claims API</text>
  </g>

  <!-- Provider 2: Keycloak -->
  <g transform="translate(310, 665)" filter="url(#shadow)">
    <rect width="180" height="60" rx="8" fill="#FFFFFF" stroke="#E3E3EC" />
    <text x="90" y="25" font-size="10" font-weight="700" fill="#222235" text-anchor="middle">Keycloak Broker</text>
    <text x="90" y="45" font-size="8" fill="#6B6B84" text-anchor="middle">OAuth2 Authorization</text>
  </g>

  <!-- Provider 3: OAM -->
  <g transform="translate(520, 665)" filter="url(#shadow)">
    <rect width="180" height="60" rx="8" fill="#FFFFFF" stroke="#E3E3EC" />
    <text x="90" y="25" font-size="10" font-weight="700" fill="#222235" text-anchor="middle">Oracle Access Manager</text>
    <text x="90" y="45" font-size="8" fill="#6B6B84" text-anchor="middle">Header Injection</text>
  </g>

  <!-- Provider 4: Sailpoint -->
  <g transform="translate(730, 665)" filter="url(#shadow)">
    <rect width="180" height="60" rx="8" fill="#FFFFFF" stroke="#E3E3EC" />
    <text x="90" y="25" font-size="10" font-weight="700" fill="#222235" text-anchor="middle">Sailpoint IdentityNow</text>
    <text x="90" y="45" font-size="8" fill="#6B6B84" text-anchor="middle">IGA SCIM Platform</text>
  </g>

  <!-- Connections: Backend API to External Systems -->
  <path d="M 620 380 L 620 590 L 200 590 L 200 655" fill="none" stroke="#8E8EA8" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <path d="M 400 590 L 400 655" fill="none" stroke="#8E8EA8" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <path d="M 600 590 L 600 655" fill="none" stroke="#8E8EA8" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <path d="M 800 590 L 800 655" fill="none" stroke="#8E8EA8" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <text x="210" y="605" font-size="8.5" fill="#6B6B84">Identity Sync &amp; Governance Conns</text>

  <!-- LEGEND -->
  <g transform="translate(50, 435)" font-size="9">
    <rect width="320" height="110" rx="6" fill="#FAF9FC" stroke="#E3E3EC" />
    <text x="15" y="20" font-weight="700" fill="#222235">Legenda / Convenções C4 Enterprise</text>
    <rect x="15" y="32" width="12" height="12" fill="#660099" rx="2" />
    <text x="35" y="42" fill="#6B6B84">Fronteira interna do sistema SPN</text>
    <rect x="15" y="52" width="12" height="12" fill="#FFFFFF" stroke="#E3E3EC" stroke-width="1.5" rx="2" />
    <text x="35" y="62" fill="#6B6B84">Componentes / Contêineres de dados</text>
    <rect x="15" y="72" width="12" height="12" fill="#FF9900" rx="2" />
    <text x="35" y="82" fill="#6B6B84">Proxy Reverso na Edge / Disco de Volume na Render</text>
    <rect x="15" y="92" width="12" height="12" fill="none" stroke="#8E8EA8" stroke-width="1.5" stroke-dasharray="2,2" rx="2" />
    <text x="35" y="102" fill="#6B6B84">Conexão a Microsserviço Externo Simulado</text>
  </g>
</svg>
